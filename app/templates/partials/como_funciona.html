{% set t = txt.como_funciona %}
<section id="como-funciona" class="section section-dark" aria-labelledby="como-funciona-title">
  <div class="container container--narrow">
    <div class="section-head section-head--center">
      {% if t.chamada %}<p class="eyebrow">{{ t.chamada }}</p>{% endif %}
      <h2 id="como-funciona-title" class="section-title">{{ t.titulo }}</h2>
    </div>
    <ol class="steps">
      {% for st in site.passos %}
      <li class="step reveal">
        <span class="step-number" aria-hidden="true">{{ loop.index }}</span>
        <h3><span class="visually-hidden">Passo {{ loop.index }}: </span>{{ st.titulo }}</h3>
        {% if st.descricao %}<p>{{ st.descricao }}</p>{% endif %}
      </li>
      {% endfor %}
    </ol>
  </div>
</section>
