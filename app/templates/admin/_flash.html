{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="adm-flashes">
  {% for cat, msg in messages %}
  <p class="adm-flash adm-flash--{{ 'error' if cat == 'error' else 'ok' }}" role="{{ 'alert' if cat == 'error' else 'status' }}">{{ msg }}</p>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
