{% extends "admin/base.html" %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<div class="adm-head">
  <div>
    <h1>Alterar senha</h1>
    <p class="adm-intro">Use pelo menos 10 caracteres. Depois de alterar, a senha do arquivo .env deixa de valer.</p>
  </div>
</div>
<section class="adm-card adm-card--narrow">
  <form method="post" action="{{ url_for('admin.password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="af"><label for="atual">Senha atual</label><input id="atual" name="atual" type="password" autocomplete="current-password" required></div>
    <div class="af"><label for="nova">Nova senha</label><input id="nova" name="nova" type="password" autocomplete="new-password" minlength="10" required></div>
    <div class="af"><label for="confirmacao">Repita a nova senha</label><input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" minlength="10" required></div>
    <button class="adm-btn adm-btn--primary" type="submit">Salvar nova senha</button>
  </form>
</section>
{% endblock %}
