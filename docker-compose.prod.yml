# Produção em VPS com HTTPS automático (Let's Encrypt) via Caddy.
# Uso:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requer DOMAIN no .env e o DNS do domínio apontando para o IP do servidor.
services:
  web:
    ports: !reset []
    expose:
      - "8000"
    environment:
      APP_ENV: production
      TRUST_PROXY: "true"
      SESSION_COOKIE_SECURE: "true"

  caddy:
    image: caddy:2.10-alpine
    container_name: jaqueline-sias-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
